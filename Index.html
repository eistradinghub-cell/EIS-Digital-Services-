<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIS Trading Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo"><span class="logo-icon">▲</span> EIS Trading Hub</div>
        <nav id="nav-auth" class="nav-links">
            <button id="btn-show-login" class="btn btn-ghost">Log In</button>
            <button id="btn-show-signup" class="btn btn-primary">Sign Up</button>
        </nav>
        <nav id="nav-user" class="nav-links" style="display: none;">
            <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
            <button id="btn-logout" class="btn btn-ghost" style="color: var(--danger);">Log Out</button>
        </nav>
    </header>

    <main class="container">
        <section id="view-home" class="view">
            <div class="hero">
                <h1>Welcome to EIS Trading Hub</h1>
                <p>Your trusted platform for professional BVN enrollment and digital services.</p>
                <div class="hero-actions">
                    <button class="btn btn-primary btn-large" onclick="document.getElementById('btn-show-signup').click()">Get Started</button>
                </div>
            </div>
        </section>

        <section id="view-login" class="view card auth-card" style="display: none;">
            <h2>Log In to Your Account</h2>
            <form id="form-login">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log In</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </section>

        <section id="view-signup" class="view card auth-card" style="display: none;">
            <h2>Create a New Account</h2>
            <form id="form-signup">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="signup-phone" required placeholder="08012345678">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required placeholder="Min. 8 characters">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
                <p id="signup-error" class="error-msg"></p>
                <p id="signup-success" class="success-msg"></p>
            </form>
        </section>
    </main>

    <footer class="footer"><p>&copy; 2024 EIS Trading Hub. All rights reserved.</p></footer>

    <script type="module" src="js/auth.js"></script>
</body>
  </html>
