<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EIS Trading Hub</title>
    <!-- ?v=10 ZAI TILASTA SABON TSARI -->
    <link rel="stylesheet" href="css/styles.css?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
      <div class="nav-row">
        <a class="brand" href="dashboard.html">
          <svg class="brand-mark" viewBox="0 0 48 48"><rect x="2" y="2" width="44" height="44" rx="12" fill="#1f4fe0"/><path d="M14 32 L24 14 L34 32" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="26" r="2.6" fill="#12b894"/></svg>
          <span class="brand-text"><b>EIS</b><span>Digital Services</span></span>
        </a>
        <div class="nav-right">
          <nav class="nav-links">
            <a href="dashboard.html" class="btn active">Dashboard</a>
            <a href="#" class="btn">Marketplace</a>
            <a href="admin.html" id="nav-admin" class="btn" style="display: none;">Admin</a>
            <button id="nav-logout" class="btn" style="color: var(--bad); border-color: var(--bad);">Log out</button>
          </nav>
          <a href="support.html" id="msgBtn" class="icon-btn">
             <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          </a>
        </div>
      </div>
    </header>

    <main class="wrap sec">
        <div class="card">
            <h1 style="font-family: 'Plus Jakarta Sans'; font-size: 24px;">Dashboard</h1>
            <p id="welcome" style="color: var(--mu); margin-top: 5px;">Loading profile...</p>
        </div>

        <div class="card">
            <h3 style="font-family: 'Plus Jakarta Sans'; margin-bottom: 10px;">1. Choose a service</h3>
            <div class="svcs" id="services-container">
                <p>Loading services...</p>
            </div>
            <div id="pay-section" style="display: none; margin-top: 20px;">
                <div class="demo">Demo payment only. No real money is charged.</div>
                <button id="btn-pay" class="btn btn-primary" style="width: 100%;">Pay Now</button>
            </div>
            <p class="msg" id="pay-msg"></p>
        </div>

        <form class="card" id="app-form" style="display: none;">
            <h3 style="font-family: 'Plus Jakarta Sans'; margin-bottom: 10px;">2. Application form</h3>
            <div class="form-grid">
                <div><label>KEGOW account number</label><input type="text" id="f-kegow" required></div>
                <div><label>Agent location state</label><select id="f-agentState" required></select></div>
                <div><label>BVN number (11 digits)</label><input type="text" id="f-bvn" required></div>
                <div><label>Bank name</label><input type="text" id="f-bankName" required></div>
                <div><label>Account number (10 digits)</label><input type="text" id="f-accountNo" required></div>
                <div><label>Account name</label><input type="text" id="f-accountName" required></div>
                <div><label>Agent first name</label><input type="text" id="f-firstName" required></div>
                <div><label>Last name</label><input type="text" id="f-lastName" required></div>
                <div><label>Email</label><input type="email" id="f-email" required></div>
                <div><label>Phone number</label><input type="tel" id="f-phone" required></div>
                <div class="full"><label>Home address</label><textarea id="f-address" required></textarea></div>
                <div><label>State of residence</label><select id="f-stateRes" required></select></div>
                <div><label>Date of birth</label><input type="date" id="f-dob" required></div>
            </div>
            <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 18px;">Submit application</button>
            <p class="msg" id="form-msg"></p>
        </form>

        <div class="card">
            <h3 style="font-family: 'Plus Jakarta Sans'; margin-bottom: 10px;">My applications</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>Name</th><th>Reference</th><th>Service</th><th>Status</th></tr></thead>
                    <tbody id="apps-list">
                        <tr><td colspan="4" style="text-align: center;">No applications yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ?v=10 ZAI TILASTA SABON TSARI -->
    <script type="module" src="js/dashboard.js?v=10"></script>
</body>
</html>
