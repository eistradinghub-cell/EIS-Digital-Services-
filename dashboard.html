<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EIS Trading Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7fc; --sf: #fff; --ink: #0d2540; --mu: #5a6b80; --ln: #e2e8f0; --blue: #1f4fe0; --blue-deep: #0d2a63; --blue-soft: #eaf0ff; --mint: #12b894; --bad: #b3261e; --shadow-sm: 0 1px 2px rgba(13,37,64,.06); --shadow-md: 0 4px 16px rgba(13,37,64,.08); }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
        .sec { padding: 40px 0; }
        .site-header { background: rgba(255,255,255,.95); border-bottom: 1px solid var(--ln); position: sticky; top: 0; z-index: 50; }
        .nav-row { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 10px 16px; max-width: 1080px; margin: 0 auto; flex-wrap: wrap; gap: 10px; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; }
        .brand-mark { width: 36px; height: 36px; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; font: 600 15px 'Inter', sans-serif; padding: 11px 20px; border-radius: 10px; border: 0; cursor: pointer; background: var(--blue); color: #fff; text-decoration: none; transition: all .15s; }
        .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ln); }
        .btn-ghost:hover { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
        .btn-primary { background: var(--blue); }
        .card { background: #fff; border: 1px solid var(--ln); border-radius: 14px; padding: 28px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .card.wide { max-width: none; }
        .svcs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
        @media(max-width:600px) { .svcs { grid-template-columns: 1fr; } }
        .svcs button { background: #fff; border: 1.5px solid var(--ln); padding: 16px; border-radius: 10px; text-align: left; cursor: pointer; transition: .15s; }
        .svcs button:hover { border-color: var(--blue); }
        .svcs button.on { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 3px rgba(31,79,224,.15); }
        .svcs small { display: block; color: var(--blue); font: 700 16px 'Plus Jakarta Sans', sans-serif; margin-top: 4px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
        .form-grid .full { grid-column: 1 / -1; }
        label { display: block; font: 600 14px 'Inter', sans-serif; margin: 14px 0 6px; }
        input, select, textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--ln); border-radius: 8px; font: 400 16px 'Inter', sans-serif; background: #fff; color: var(--ink); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
        .demo { background: #fff4cc; border: 1px solid #e6d177; padding: 10px; border-radius: 8px; font-size: 14px; margin: 10px 0; color: #8a6a00; }
        .msg { margin: 14px 0 0; font: 500 14px 'Inter', sans-serif; min-height: 1.4em; }
        .msg.err { color: var(--bad); } .msg.ok { color: #0b7a5f; }
        .support-card { background: linear-gradient(135deg, #1f4fe0, #3a68ff); color: #fff; border: 0; padding: 14px 18px; border-radius: 12px; display: flex; align-items: center; gap: 12px; }
        .support-icon { width: 40px; height: 40px; background: rgba(255,255,255,.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .support-text h4 { margin: 0; font-weight: 700; font-size: 15px; }
        .support-text p { margin: 0; font-size: 12px; opacity: .9; }
        .support-btn { background: #fff; color: #1f4fe0; font-weight: 600; padding: 8px 16px; font-size: 14px; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>

<header class="site-header">
  <div class="nav-row">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 48 48"><rect x="2" y="2" width="44" height="44" rx="12" fill="#1f4fe0"/><path d="M14 32 L24 14 L34 32" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="26" r="2.6" fill="#12b894"/></svg>
      EIS <span style="font-weight: 600; font-size: 12px; color: var(--mu); margin-left: 4px;">Digital Services</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="btn btn-ghost">Home</a>
      <a href="admin.html" class="btn btn-ghost" id="nav-admin" style="display: none;">Admin</a>
      <button id="btn-logout" class="btn btn-ghost" style="color: var(--bad);">Log Out</button>
    </nav>
  </div>
</header>

<main class="wrap sec">
    <div class="card" style="margin-bottom: 20px;">
        <h2 style="margin: 0;">Dashboard</h2>
        <p id="who" style="color: var(--mu); font-weight: 500; margin-top: 10px;">Loading...</p>
    </div>

    <div class="card wide">
      <h3 style="margin-top: 0;">1. Choose a service</h3>
      <div class="svcs" id="svcs"></div>
      <div id="pay" style="display: none;">
        <div class="demo">Demo payment only. No real money is charged.</div>
        <button id="paybtn" class="btn btn-primary">Pay Now</button>
      </div>
      <p class="msg" id="m-pay"></p>
    </div>

    <form class="card wide" id="f-app" style="display: none;">
      <h3 style="margin-top: 0;">2. Application form</h3>
      <div class="form-grid">
        <div><label>KEGOW account number</label><input type="text" id="a-kegow" required></div>
        <div><label>Agent location state</label><select id="a-agentState" required></select></div>
        <div><label>BVN number (11 digits)</label><input type="text" id="a-bvn" required></div>
        <div><label>Bank name</label><input type="text" id="a-bankName" required></div>
        <div><label>Account number (10 digits)</label><input type="text" id="a-accountNo" required></div>
        <div><label>Account name</label><input type="text" id="a-accountName" required></div>
        <div><label>Agent first name</label><input type="text" id="a-firstName" required></div>
        <div><label>Last name</label><input type="text" id="a-lastName" required></div>
        <div><label>Email</label><input type="email" id="a-email" required></div>
        <div><label>Phone number</label><input type="tel" id="a-phone" required></div>
        <div class="full"><label>Home address</label><textarea id="a-address" required></textarea></div>
        <div><label>State of residence</label><select id="a-stateRes" required></select></div>
        <div><label>Date of birth</label><input type="date" id="a-dob" required></div>
      </div>
      <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 18px;">Submit application</button>
      <p class="msg" id="m-app"></p>
    </form>

    <div class="card wide">
      <h3 style="margin-top: 0;">My applications</h3>
      <div style="overflow-x: auto; border: 1px solid var(--ln); border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
          <thead><tr style="background: var(--blue-soft); color: var(--blue-deep); text-align: left;">
            <th style="padding: 12px;">Name</th><th style="padding: 12px;">Ref</th><th style="padding: 12px;">Service</th><th style="padding: 12px;">Status</th>
          </tr></thead>
          <tbody id="mine"></tbody>
        </table>
      </div>
    </div>

    <div class="support-card">
      <div class="support-icon">💬</div>
      <div class="support-text">
        <h4>Need Help? Customer Care</h4>
        <p>Chat with our support team.</p>
      </div>
      <a href="support.html" class="support-btn">Open Chat →</a>
    </div>
</main>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
