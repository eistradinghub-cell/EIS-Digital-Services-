<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EIS Trading Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .dash-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
        @media(min-width: 768px) { .dash-grid { grid-template-columns: 2fr 1fr; } }
        .service-card { border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .service-card:hover { border-color: var(--primary); background: var(--bg); }
        .service-card.selected { border-color: var(--primary); background: #eaf0ff; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-in-review { background: #fff4cc; color: #8a6a00; }
        .status-completed { background: #e3f5ef; color: #0b7a5f; }
        .status-rejected { background: #fde8e6; color: #b3261e; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo"><span class="logo-icon">▲</span> EIS Trading Hub</div>
        <nav class="nav-links">
            <a href="index.html" class="btn btn-ghost">Home</a>
            <a href="admin.html" class="btn btn-ghost" id="nav-admin-link" style="display:none;">Admin Panel</a>
            <button id="btn-logout" class="btn btn-ghost" style="color: var(--danger);">Log Out</button>
        </nav>
    </header>

    <main class="container">
        <h1>Customer Dashboard</h1>
        <p id="welcome-msg" style="color: var(--text-muted); margin-bottom: 20px;">Loading...</p>

        <div class="dash-grid">
            <!-- Left Column: Services & Applications -->
            <div>
                <div class="card">
                    <h2>1. Choose a Service</h2>
                    <div id="services-list">
                        <p>Loading services...</p>
                    </div>
                    <button id="btn-pay" class="btn btn-primary btn-block" style="display:none;">Proceed to Payment</button>
                    <p id="payment-msg" class="error-msg"></p>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <h2>My Applications</h2>
                    <div id="applications-list">
                        <p>No applications yet.</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Support Chat -->
            <div>
                <div class="card" style="background: linear-gradient(135deg,#1f4fe0,#3a68ff); color: white;">
                    <h2 style="color: white; text-align: left;">Customer Support</h2>
                    <p style="font-size: 14px; margin-bottom: 15px;">Need help? Chat with our support team.</p>
                    <a href="support.html" class="btn" style="background: white; color: #1f4fe0; font-weight: 700; width: 100%;">Open Live Chat</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer"><p>&copy; 2024 EIS Trading Hub. All rights reserved.</p></footer>

    <script type="module" src="js/dashboard.js"></script>
</body>
  </html>
