<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#142D4E">

    <title>Customer Support - EIS Digital Services</title>

    <link rel="stylesheet" href="css/styles.css?v=10">

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/eis-typography.css?v=1">

<style>
        :root {
            --support-navy: #142D4E;
            --support-teal: #168477;
            --support-bg: #F4F7F8;
            --support-white: #FFFFFF;
            --support-border: #E5EAEE;
            --support-text: #263445;
            --support-muted: #718096;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: var(--support-bg);
            color: var(--support-text);
        }

        /* NAVIGATION */

        .navbar {
            min-height: 70px;
            padding: 12px 5%;
            background: var(--support-white);
            border-bottom: 1px solid var(--support-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: relative;
            z-index: 5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--support-navy);
            font-size: 17px;
            font-weight: 800;
            white-space: nowrap;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--support-navy);
            color: white;
            font-size: 17px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links .btn {
            min-height: 40px;
            padding: 9px 15px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .nav-links .btn-ghost {
            background: #F1F5F7;
            color: var(--support-navy);
            border: 1px solid var(--support-border);
        }

        .nav-links .btn-ghost:hover {
            background: #E8EFF2;
        }

        #logout-btn {
            color: #B42318 !important;
        }

        /* MAIN LAYOUT */

        .support-main {
            width: 100%;
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 22px;
        }

        .support-heading {
            margin-bottom: 20px;
        }

        .support-heading h1 {
            margin: 0 0 7px;
            color: var(--support-navy);
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .support-heading p {
            margin: 0;
            color: var(--support-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* CHAT CONTAINER */

        .chat-container {
            height: 690px;
            max-height: calc(100vh - 190px);
            min-height: 450px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--support-white);
            border: 1px solid var(--support-border);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(20, 45, 78, .06);
        }

        /* CHAT HEADER */

        .chat-header {
            min-height: 82px;
            padding: 15px 22px;
            display: flex;
            align-items: center;
            gap: 13px;
            background: var(--support-navy);
            color: white;
            flex-shrink: 0;
        }

        .support-avatar {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 13px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            font-weight: 800;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .support-status {
            margin-top: 6px;
            display: block;
            color: #C9D9E8;
            font-size: 12px;
        }

        .support-status::first-letter {
            color: #55D6A2;
        }

        .chat-header-label {
            padding: 7px 11px;
            border-radius: 20px;
            background: rgba(255,255,255,.12);
            color: #E6F1F5;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* NOTICE */

        .chat-notice {
            padding: 10px 15px;
            font-size: 12px;
            text-align: center;
            background: #F0F7F6;
            color: var(--support-text);
            display: none;
        }

        .chat-notice.error {
            display: block;
            color: #B42318;
            background: #FFF0EE;
        }

        .chat-notice.success {
            display: block;
            color: #18733B;
            background: #EAF8EF;
        }

        /* MESSAGES */

        .chat-messages {
            flex: 1;
            min-height: 0;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #F7F9FA;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #CBD5DF;
            border-radius: 10px;
        }

        .chat-messages > p {
            max-width: 350px;
            align-self: center;
            margin: auto 0;
            padding: 12px 18px;
            border-radius: 10px;
            background: white;
            border: 1px solid var(--support-border);
            line-height: 1.6;
        }

        .msg-bubble {
            max-width: 75%;
            width: fit-content;
            padding: 12px 15px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
            box-shadow: 0 2px 7px rgba(20,45,78,.04);
        }

        .msg-mine {
            align-self: flex-end;
            background: var(--support-navy);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-theirs {
            align-self: flex-start;
            background: white;
            color: var(--support-text);
            border: 1px solid var(--support-border);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            margin-top: 6px;
            font-size: 10px;
            text-align: right;
            opacity: .7;
        }

        /* INPUT AREA */

        .chat-input-area {
            min-height: 82px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            border-top: 1px solid var(--support-border);
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            width: 100%;
            min-width: 0;
            height: 48px;
            padding: 0 18px;
            border: 1px solid #DCE4E9;
            border-radius: 12px;
            outline: none;
            background: #F8FAFB;
            color: var(--support-text);
            font-family: inherit;
            font-size: 13px;
            transition: .2s ease;
        }

        .chat-input-area input:focus {
            border-color: var(--support-teal);
            background: white;
            box-shadow: 0 0 0 3px rgba(22,132,119,.09);
        }

        .chat-input-area input::placeholder {
            color: #99A5B1;
        }

        .chat-input-area button {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border: none;
            border-radius: 12px;
            background: var(--support-teal);
            color: white;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s ease;
        }

        .chat-input-area button:hover {
            background: #116F64;
            transform: translateY(-1px);
        }

        .chat-input-area button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        /* FOOTER */

        .support-footer {
            padding: 15px 5px;
            text-align: center;
            color: var(--support-muted);
            font-size: 11px;
        }

        /* TABLET */

        @media (max-width: 768px) {
            .support-main {
                margin: 25px auto;
                padding: 0 15px;
            }

            .chat-container {
                height: calc(100vh - 230px);
                max-height: 700px;
            }

            .chat-messages {
                padding: 18px;
            }

            .msg-bubble {
                max-width: 85%;
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {
            .navbar {
                min-height: 62px;
                padding: 9px 12px;
                gap: 7px;
            }

            .logo {
                font-size: 13px;
                gap: 7px;
            }

            .logo-icon {
                width: 31px;
                height: 31px;
                font-size: 14px;
            }

            .nav-links {
                gap: 6px;
            }

            .nav-links .btn {
                min-height: 35px;
                padding: 7px 9px;
                font-size: 10px;
                border-radius: 7px;
                white-space: nowrap;
            }

            .support-main {
                margin: 19px auto;
                padding: 0 10px;
            }

            .support-heading {
                margin-bottom: 14px;
            }

            .support-heading h1 {
                font-size: 20px;
            }

            .support-heading p {
                font-size: 11px;
            }

            .chat-container {
                height: calc(100dvh - 175px);
                min-height: 390px;
                max-height: none;
                border-radius: 12px;
            }

            .chat-header {
                min-height: 69px;
                padding: 11px 13px;
                gap: 10px;
            }

            .support-avatar {
                width: 40px;
                height: 40px;
                min-width: 40px;
                border-radius: 10px;
                font-size: 13px;
            }

            .chat-header h3 {
                font-size: 14px;
            }

            .support-status {
                font-size: 10px;
            }

            .chat-header-label {
                padding: 6px 8px;
                font-size: 9px;
            }

            .chat-messages {
                padding: 13px 10px;
                gap: 12px;
            }

            .msg-bubble {
                max-width: 88%;
                padding: 10px 12px;
                font-size: 12px;
                border-radius: 12px;
            }

            .msg-time {
                font-size: 9px;
            }

            .chat-input-area {
                min-height: 68px;
                padding: 10px;
                gap: 8px;
            }

            .chat-input-area input {
                height: 44px;
                padding: 0 13px;
                font-size: 12px;
                border-radius: 10px;
            }

            .chat-input-area button {
                width: 44px;
                height: 44px;
                min-width: 44px;
                border-radius: 10px;
                font-size: 18px;
            }

            .support-footer {
                padding: 10px 3px;
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .logo {
                font-size: 11px;
            }

            .nav-links .btn {
                padding: 7px 6px;
                font-size: 9px;
            }

            .chat-header-label {
                display: none;
            }
        }
    </style>

<style id="eis-route-protection">html.eis-route-check body{visibility:hidden!important}</style>
<script type="module" src="js/route-guard.js?v=1"></script>
<script>document.documentElement.classList.add("eis-route-check");</script>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">▲</span>
            EIS Digital Services
        </div>

        <nav class="nav-links">

            <a href="dashboard.html" class="btn btn-ghost">
                ← Dashboard
            </a>

            <button
                id="logout-btn"
                class="btn btn-ghost"
                type="button"
            >
                Log Out
            </button>

        </nav>

    </header>

    <main class="support-main">

        <div class="support-heading">
            <h1>Customer Support</h1>
            <p>We're here to help. Send us a message and our support team will assist you.</p>
        </div>

        <div class="chat-container">

            <!-- CHAT HEADER -->

            <div class="chat-header">

                <div class="support-avatar">
                    EIS
                </div>

                <div class="chat-header-info">
                    <h3>EIS Support Team</h3>

                    <span class="support-status">
                        ● Customer Support
                    </span>
                </div>

                <div class="chat-header-label">
                    Official Support
                </div>

            </div>

            <!-- NOTIFICATION AREA -->

            <div
                id="support-message"
                class="chat-notice"
                role="status"
                aria-live="polite"
            ></div>

            <!-- CHAT MESSAGES -->

            <div
                class="chat-messages"
                id="chat-messages"
                aria-live="polite"
            >

                <p style="
                    text-align:center;
                    color:#888;
                    font-size:13px;
                    margin-top:20px;
                ">
                    Connecting to support...
                </p>

            </div>

            <!-- CHAT INPUT -->

            <form
                class="chat-input-area"
                id="chat-form"
            >

                <input
                    type="text"
                    id="chat-input"
                    placeholder="Type your message here..."
                    autocomplete="off"
                    maxlength="2000"
                    aria-label="Type your message"
                >

                <button
                    type="submit"
                    id="btn-send-msg"
                    aria-label="Send message"
                    title="Send message"
                >
                    ➤
                </button>

            </form>

        </div>

        <div class="support-footer">
            EIS Digital Services · Customer Support
        </div>

    </main>

    <!-- SUPPORT JAVASCRIPT -->

    <script
        type="module"
        src="js/support.js?v=9"
    ></script>

<style id="eis-android-responsive">

 html,body{width:100%;max-width:100%;overflow-x:clip}
 .navbar{min-height:0!important;padding:10px 13px!important;flex-wrap:wrap!important;gap:10px!important}
 .logo{font-size:15px!important;min-width:0!important}
 .nav-links{width:100%!important;display:flex!important;flex-wrap:wrap!important;gap:8px!important}
 .nav-links .btn{flex:1 1 auto;min-height:44px!important;padding:10px!important}
 .support-main{width:100%!important;max-width:100%!important;margin:18px auto!important;padding:0 12px!important}
 .support-heading h1{font-size:22px!important}
 .chat-container{width:100%!important;max-width:100%!important;margin:0!important;border-radius:10px!important}
 .chat-container *{min-width:0}
 .chat-messages,.messages-container,.chat-body{max-width:100%!important;overflow-y:auto!important;overflow-x:hidden!important}
 .chat-message,.message{max-width:88%!important;overflow-wrap:anywhere!important;word-break:break-word!important}
 .chat-input-container,.chat-input-area,.message-form{display:flex!important;gap:8px!important;padding:10px!important}
 .chat-input-container input,.chat-input-area input,.message-form input,.chat-input-container textarea,.chat-input-area textarea,.message-form textarea{width:100%!important;min-width:0!important;font-size:16px!important}
 button,.btn{min-height:44px}
}
@media(max-width:360px){
 .support-main{padding:0 10px!important}
 .nav-links .btn{font-size:12px!important}
}
</style>
</body>
</html>
