<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Support - EIS Trading Hub</title>

    <link rel="stylesheet" href="css/styles.css?v=9">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .support-main {
            max-width: 950px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 75vh;
            min-height: 450px;
            max-height: 800px;
            background: #e5ddd5;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .chat-header {
            background: linear-gradient(135deg, #1f4fe0, #3a68ff);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .support-avatar {
            width: 45px;
            height: 45px;
            min-width: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f4fe0;
            font-weight: 700;
            font-size: 15px;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .support-status {
            font-size: 12px;
            opacity: .9;
            display: block;
            margin-top: 4px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 11px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .msg-mine {
            align-self: flex-end;
            background: #dcf8c6;
            color: #111;
            border-bottom-right-radius: 3px;
        }

        .msg-theirs {
            align-self: flex-start;
            background: white;
            color: #111;
            border-bottom-left-radius: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,.1);
        }

        .msg-time {
            font-size: 10px;
            color: #666;
            text-align: right;
            margin-top: 5px;
        }

        .chat-input-area {
            padding: 12px;
            background: #f0f0f0;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #ddd;
        }

        .chat-input-area input {
            flex: 1;
            min-width: 0;
            padding: 13px 16px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        .chat-input-area input:focus {
            border-color: #1f4fe0;
        }

        .chat-input-area button {
            background: #1f4fe0;
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 19px;
        }

        .chat-input-area button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .chat-notice {
            padding: 8px 12px;
            font-size: 12px;
            text-align: center;
            background: #fff;
            color: #555;
            display: none;
        }

        .chat-notice.error {
            display: block;
            color: #b42318;
            background: #fff0ee;
        }

        .chat-notice.success {
            display: block;
            color: #18733b;
            background: #eaf8ef;
        }

        @media (max-width: 600px) {
            .support-main {
                margin: 12px auto;
                padding: 0 8px;
            }

            .chat-container {
                height: calc(100dvh - 150px);
                min-height: 400px;
                border-radius: 8px;
            }

            .chat-messages {
                padding: 12px;
            }

            .msg-bubble {
                max-width: 88%;
            }

            .navbar {
                padding-left: 10px;
                padding-right: 10px;
            }

            .logo {
                font-size: 14px;
            }

            .nav-links {
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">▲</span>
            EIS Trading Hub
        </div>

        <nav class="nav-links">

            <a href="dashboard.html" class="btn btn-ghost">
                Back to Dashboard
            </a>

            <button
                id="logout-btn"
                class="btn btn-ghost"
                style="color: var(--danger);"
                type="button"
            >
                Log Out
            </button>

        </nav>

    </header>


    <main class="support-main">

        <div class="chat-container">

            <!-- CHAT HEADER -->

            <div class="chat-header">

                <div class="support-avatar">
                    EIS
                </div>

                <div>
                    <h3>EIS Support</h3>

                    <span class="support-status">
                        ● Customer Support
                    </span>
                </div>

            </div>


            <!-- NOTIFICATION AREA -->

            <div
                id="support-message"
                class="chat-notice"
                role="status"
                aria-live="polite"
            ></div>


            <!-- CHAT MESSAGES -->

            <div
                class="chat-messages"
                id="chat-messages"
                aria-live="polite"
            >

                <p style="
                    text-align:center;
                    color:#888;
                    font-size:13px;
                    margin-top:20px;
                ">
                    Connecting to support...
                </p>

            </div>


            <!-- CHAT INPUT -->

            <form
                class="chat-input-area"
                id="chat-form"
            >

                <input
                    type="text"
                    id="chat-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                    maxlength="2000"
                    aria-label="Type your message"
                >

                <button
                    type="submit"
                    id="btn-send-msg"
                    aria-label="Send message"
                    title="Send message"
                >
                    ➤
                </button>

            </form>

        </div>

    </main>


    <!-- SUPPORT JAVASCRIPT -->

    <script
        type="module"
        src="js/support.js?v=9"
    ></script>

</body>
</html>
