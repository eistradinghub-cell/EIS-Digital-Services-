<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EIS Trading Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
        @media(max-width:768px) { .stat-grid { grid-template-columns: 1fr 1fr; } }
        .stat-card { background: #fff; border: 1px solid var(--ln); padding: 16px; border-radius: 10px; display: flex; flex-direction: column; }
        .stat-card span { font-size: 12px; color: var(--mu); text-transform: uppercase; font-weight: 600; }
        .stat-card b { font: 800 24px var(--hd); color: var(--blue); margin-top: 4px; }
        .app-item { border: 1px solid var(--ln); border-radius: 12px; padding: 20px; margin-bottom: 20px; background: #fff; border-left: 6px solid var(--blue); }
        .app-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ln); padding-bottom: 10px; margin-bottom: 15px; }
        .app-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
        @media(max-width:600px) { .app-details { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="site-header">
      <div class="nav-row">
        <a class="brand" href="index.html">
          <svg class="brand-mark" viewBox="0 0 48 48"><rect x="2" y="2" width="44" height="44" rx="12" fill="#1f4fe0"/><path d="M14 32 L24 14 L34 32" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="26" r="2.6" fill="#12b894"/></svg>
          <span class="brand-text"><b>EIS</b><span>Digital Services</span></span>
        </a>
        <div class="nav-right">
          <nav class="nav-links">
            <a href="dashboard.html" id="nav-dash" class="btn">Dashboard</a>
            <a href="#" id="nav-market" class="btn">Marketplace</a>
            <a href="admin.html" id="nav-admin" class="btn active">Admin</a>
            <button id="nav-logout" class="btn" style="color: var(--bad); border-color: var(--ln);">Log out</button>
          </nav>
          <a href="support.html" id="msgBtn" class="icon-btn">
             <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          </a>
        </div>
      </div>
    </header>

    <main class="wrap sec">
        <h1 style="font-family: 'Plus Jakarta Sans'; margin-bottom: 20px;">Overview</h1>
        
        <div class="stat-grid">
            <div class="stat-card"><span>Applications</span><b id="stat-total">0</b></div>
            <div class="stat-card"><span>In Review</span><b id="stat-review">0</b></div>
            <div class="stat-card"><span>Completed</span><b id="stat-completed">0</b></div>
            <div class="stat-card"><span>Products</span><b id="stat-products">0</b></div>
        </div>

        <div class="card" style="background: transparent; border: none; padding: 0; box-shadow: none;">
            <h3 style="font-family: 'Plus Jakarta Sans'; margin-bottom: 15px;">All Applications</h3>
            <div id="admin-apps-list">
                <p>Loading...</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
