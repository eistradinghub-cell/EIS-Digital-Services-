<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - EIS Trading Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7fc; --sf: #fff; --ink: #0d2540; --mu: #5a6b80; --ln: #e2e8f0; --blue: #1f4fe0; --blue-deep: #0d2a63; --blue-soft: #eaf0ff; --bad: #b3261e; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; }
        .container { max-width: 1080px; margin: 0 auto; padding: 20px; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
        @media(max-width:768px) { .stat-grid { grid-template-columns: 1fr 1fr; } }
        .stat-card { background: var(--sf); border: 1px solid var(--ln); padding: 16px; border-radius: 10px; display: flex; flex-direction: column; }
        .stat-card span { font-size: 12px; color: var(--mu); text-transform: uppercase; font-weight: 600; }
        .stat-card b { font: 800 24px 'Plus Jakarta Sans', sans-serif; color: var(--blue); margin-top: 4px; }
        .app-list { display: flex; flex-direction: column; gap: 20px; }
        .app-card { background: var(--sf); border: 1px solid var(--ln); border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); overflow: hidden; border-left: 6px solid var(--blue); }
        .app-head { padding: 16px 20px; background: #f8fafc; border-bottom: 1px solid var(--ln); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .app-title { font: 700 18px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 10px; }
        .app-title span { font-size: 13px; font-weight: 600; color: var(--mu); background: #e2e8f0; padding: 4px 10px; border-radius: 20px; }
        .app-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 20px; }
        @media(max-width:768px) { .app-body { grid-template-columns: 1fr; } }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px dashed var(--ln); font-size: 14px; }
        .detail-row .lbl { color: var(--mu); font-weight: 500; }
        .detail-row .val { font-weight: 600; text-align: right; word-break: break-all; }
        .app-foot { padding: 16px 20px; background: #f8fafc; border-top: 1px solid var(--ln); display: flex; justify-content: flex-end; }
        .status-select { width: auto; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--ln); font-family: 'Inter', sans-serif; font-weight: 600; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo"><span class="logo-icon">▲</span> EIS Admin</div>
        <nav class="nav-links">
            <a href="dashboard.html" class="btn btn-ghost">My Dashboard</a>
            <button id="btn-logout" class="btn btn-ghost" style="color: var(--bad);">Log Out</button>
        </nav>
    </header>

    <main class="container">
        <h1>Overview</h1>
        <div class="stat-grid">
            <div class="stat-card"><span>Applications</span><b id="stat-total">0</b></div>
            <div class="stat-card"><span>In Review</span><b id="stat-review">0</b></div>
            <div class="stat-card"><span>Completed</span><b id="stat-completed">0</b></div>
            <div class="stat-card"><span>Products</span><b id="stat-products">0</b></div>
        </div>

        <div class="card">
            <h2 style="margin-top: 0;">All Applications</h2>
            <div id="admin-apps-list" class="app-list">
                <p>Loading...</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
