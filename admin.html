<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - EIS Trading Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1f4fe0; --bg: #f4f7fc; --surface: #ffffff; --text: #0d2540; --border: #e2e8f0; --danger: #b3261e; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .logo { font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        @media(max-width: 768px) { .stat-grid { grid-template-columns: 1fr 1fr; } }
        .stat-card { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-card span { font-size: 13px; font-weight: 600; text-transform: uppercase; color: #5a6b80; }
        .stat-card h3 { font-family: 'Plus Jakarta Sans'; font-size: 28px; color: var(--primary); margin-top: 5px; }

        .app-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .app-table th { background: #f8fafc; text-align: left; padding: 15px; font-size: 14px; color: #5a6b80; font-weight: 600; }
        .app-table td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .app-table tr:last-child td { border-bottom: none; }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-review { background: #fff4cc; color: #8a6a00; }
        .badge-completed { background: #e3f5ef; color: #0b7a5f; }
        .badge-rejected { background: #fde8e6; color: #b3261e; }
        
        .status-select { padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn { padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; text-decoration: none; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo"><span>▲</span> EIS Admin</div>
        <nav style="display: flex; gap: 10px;">
            <a href="dashboard.html" class="btn btn-ghost">Customer Dashboard</a>
            <button id="btn-logout" class="btn btn-ghost" style="color: var(--danger); border-color: var(--danger);">Log Out</button>
        </nav>
    </header>

    <main class="container">
        <h1 style="font-family: 'Plus Jakarta Sans'; margin-bottom: 20px;">System Overview</h1>
        
        <div class="stat-grid">
            <div class="stat-card"><span>Total Applications</span><h3 id="stat-total">0</h3></div>
            <div class="stat-card"><span>In Review</span><h3 id="stat-review">0</h3></div>
            <div class="stat-card"><span>Completed</span><h3 id="stat-completed" style="color: #0b7a5f;">0</h3></div>
            <div class="stat-card"><span>Rejected</span><h3 id="stat-rejected" style="color: #b3261e;">0</h3></div>
        </div>

        <div style="background: var(--surface); border-radius: 12px; padding: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
            <div style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 18px;">All Applications</h2>
            </div>
            <div style="overflow-x: auto;">
                <table class="app-table">
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Service</th>
                            <th>Details (BVN/Bank)</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-apps-list">
                        <tr><td colspan="5" style="text-align: center; padding: 30px;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
