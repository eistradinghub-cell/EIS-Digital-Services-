<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142D4E">
<title>Email Verification | EIS Digital Services</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F4F7F8;
    font-family:Arial,sans-serif;
    color:#142D4E
}
.card{
    width:100%;
    max-width:460px;
    padding:42px 30px;
    background:#fff;
    border:1px solid #E2EAF1;
    border-radius:22px;
    text-align:center;
    box-shadow:0 18px 55px rgba(20,45,78,.09)
}
.brand{
    margin-bottom:30px;
    color:#168477;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px
}
.icon{
    width:76px;
    height:76px;
    margin:0 auto 22px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#E8F6F1;
    color:#168477;
    font-size:36px;
    font-weight:bold
}
h1{margin:0 0 13px;font-size:27px;line-height:1.3}
.description{
    color:#64748B;
    font-size:14px;
    line-height:1.8
}
.message{
    margin-top:22px;
    padding:14px;
    border-radius:11px;
    background:#F0F5FA;
    color:#526174;
    font-size:13px;
    line-height:1.6
}
button{
    width:100%;
    min-height:50px;
    margin-top:25px;
    border:0;
    border-radius:11px;
    background:#142D4E;
    color:white;
    font-size:14px;
    font-weight:700;
    cursor:pointer
}
button:hover{background:#168477}
button:disabled{opacity:.6;cursor:wait}
.footer{
    margin-top:28px;
    color:#94A3B8;
    font-size:11px
}
@media(max-width:480px){
    .card{padding:34px 22px}
    h1{font-size:24px}
}
</style>
</head>

<body>

<main class="card">

    <div class="brand">EIS DIGITAL SERVICES</div>

    <div class="icon" id="status-icon">✓</div>

    <h1 id="status-title">Verifying Your Email</h1>

    <p class="description" id="status-description">
        Please wait while we securely confirm your email address.
    </p>

    <div class="message" id="status-message">
        Processing your verification...
    </div>

    <button id="continue-button" disabled>
        Please wait...
    </button>

    <div class="footer">
        © 2026 EIS Digital Services. All rights reserved.
    </div>

</main>

<script type="module">

import { supabase } from './js/supabase.js';

const icon = document.getElementById('status-icon');
const title = document.getElementById('status-title');
const description = document.getElementById('status-description');
const message = document.getElementById('status-message');
const button = document.getElementById('continue-button');

function showError(text){

    icon.textContent = '!';
    icon.style.background = '#FFF1F0';
    icon.style.color = '#DC3545';

    title.textContent = 'Verification Not Completed';

    description.textContent =
        'We could not confirm your email address.';

    message.textContent = text;

    button.disabled = false;
    button.textContent = 'Return to Login';

    button.onclick = () => {
        window.location.replace('./index.html');
    };
}

async function verifyEmail(){

    try{

        const url = new URL(window.location.href);

        const code = url.searchParams.get('code');

        const errorDescription =
            url.searchParams.get('error_description');

        if(errorDescription){
            throw new Error(
                decodeURIComponent(errorDescription.replace(/\+/g,' '))
            );
        }

        let sessionData = null;

        /*
         * Exchange Supabase PKCE callback code
         * for an authenticated session.
         */

        if(code){

            const { data, error } =
                await supabase.auth.exchangeCodeForSession(code);

            if(error) throw error;

            sessionData = data;

        }else{

            const { data, error } =
                await supabase.auth.getSession();

            if(error) throw error;

            sessionData = data;
        }

        /*
         * Remove callback code from browser address.
         */

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        const session = sessionData?.session;

        if(!session){

            throw new Error(
                'Verification session not found. Please open the latest verification email link again.'
            );
        }

        const { data:userData, error:userError } =
            await supabase.auth.getUser();

        if(userError) throw userError;

        const user = userData.user;

        if(!user || !(user.email_confirmed_at || user.confirmed_at)){

            throw new Error(
                'Your email address has not been confirmed yet.'
            );
        }

        sessionStorage.removeItem(
            'eis-pending-verification-email'
        );

        icon.textContent = '✓';

        title.textContent = 'Email Verified Successfully!';

        description.textContent =
            'Your email address has been confirmed. Welcome to EIS Digital Services.';

        message.textContent =
            'Your account is now verified. You can continue to your dashboard.';

        button.disabled = false;
        button.textContent = 'Continue to Dashboard';

        button.onclick = () => {
            window.location.replace('./dashboard.html');
        };

    }catch(error){

        console.error('Email verification error:',error);

        showError(
            error.message ||
            'Something went wrong while verifying your email.'
        );
    }
}

verifyEmail();

</script>

</body>
</html>
